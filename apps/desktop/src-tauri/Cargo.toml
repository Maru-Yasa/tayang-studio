[package]
name = "tayang-studio"
version = "0.0.8"
description = "Tayang Studio"
edition = "2021"

[lib]
name = "tayang_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
sys-locale = "=0.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
unicode-normalization = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "macros", "time"] }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tauri-plugin-notification = "=2.8.0"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-updater = "=2.14.0"
tauri-plugin-process = "=2.4.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Sign-in token storage in the OS keychain. Pinned; each OS uses its native store. Linux talks to the
# Secret Service over pure-Rust D-Bus (zbus) with pure-Rust crypto: no libdbus, no OpenSSL.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
keyring = { version = "=3.6.3", features = ["windows-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "=3.6.3", features = ["async-secret-service", "async-io", "crypto-rust"] }

# The "Your API" engine ships as .tar.gz on Linux (zip elsewhere).
[target.'cfg(target_os = "linux")'.dependencies]
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
